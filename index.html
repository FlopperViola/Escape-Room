<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucchetto della Prigione</title>
    <style>
        /* Stile generale */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #444;
            margin: 0;
            flex-direction: column;
            text-align: center;
            transition: background 0.5s;
        }

        /* Cambio colore nella pagina finale */
        .final-bg { background-color: #bbb; }

        /* Contenitore principale */
        .container {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .visible { display: block; }

        /* Lucchetto */
        .lock {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lock-body {
            width: 100px;
            height: 120px;
            background: #333;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 5px solid #222;
            position: relative;
        }

        .lock-shackle {
            width: 60px;
            height: 60px;
            border: 5px solid #222;
            border-top: none;
            border-radius: 30px 30px 0 0;
            position: absolute;
            top: -50px;
            background: transparent;
        }

        .rotors {
            display: flex;
            gap: 5px;
        }

        .rotor {
            width: 40px;
            height: 50px;
            background: #222;
            color: white;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }

        .button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover { background-color: #0056b3; }

        /* Pop-up */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Messaggio di transizione */
        .transition-message {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            text-align: center;
            display: none;
        }

        /* Media queries per dispositivi mobili */
        @media (max-width: 600px) {
            .lock-body { width: 80px; height: 100px; }
            .rotor { width: 30px; height: 40px; font-size: 24px; }
            .button { font-size: 16px; padding: 8px 15px; }
            .container { max-width: 300px; }
        }
    </style>
</head>
<body>

    <!-- PRIMA SFIDA: Lucchetto 963 -->
    <div id="lock1" class="container visible">
        <h2>🔒 Inserisci il codice per sbloccare</h2>
        <div class="lock">
            <div class="lock-shackle"></div>
            <div class="lock-body">
                <div class="rotors">
                    <div class="rotor" onclick="rotateRotor(1)">0</div>
                    <div class="rotor" onclick="rotateRotor(2)">0</div>
                    <div class="rotor" onclick="rotateRotor(3)">0</div>
                </div>
            </div>
        </div>
        <button class="button" onclick="checkCode(1, '963')">Sblocca</button>
    </div>

    <!-- MESSAGGIO TRANSIZIONE -->
    <div id="transition1" class="transition-message">✔ Complimenti! Ora verrai indirizzato alla seconda sfida...</div>

    <!-- SECONDA SFIDA: Testo -->
    <div id="textChallenge" class="container">
        <h2>INDICAMI L'OGGETTO RITROVATO</h2>
        <input type="text" id="answer" placeholder="Scrivi qui...">
        <button class="button" onclick="checkAnswer()">Invia</button>
    </div>

    <!-- TERZA SFIDA: Lucchetto 254 -->
    <div id="lock2" class="container">
        <h2>🔒 Inserisci il codice per sbloccare</h2>
        <div class="lock">
            <div class="lock-shackle"></div>
            <div class="lock-body">
                <div class="rotors">
                    <div class="rotor" onclick="rotateRotor(4)">0</div>
                    <div class="rotor" onclick="rotateRotor(5)">0</div>
                    <div class="rotor" onclick="rotateRotor(6)">0</div>
                </div>
            </div>
        </div>
        <button class="button" onclick="checkCode(2, '254')">Sblocca</button>
    </div>

    <!-- PAGINA FINALE -->
    <div id="congrats" class="transition-message">🎉 COMPLIMENTI HAI COMPLETATO LE SFIDE! 🎉</div>

    <script>
        let rotorValues = [0, 0, 0, 0, 0, 0];

        function rotateRotor(index) {
            let rotor = document.querySelectorAll(".rotor")[index - 1];
            rotorValues[index - 1] = (rotorValues[index - 1] + 1) % 10;
            rotor.innerText = rotorValues[index - 1];
        }

        function checkCode(lockNumber, correctCode) {
            let code = lockNumber === 1
                ? "" + rotorValues[0] + rotorValues[1] + rotorValues[2]
                : "" + rotorValues[3] + rotorValues[4] + rotorValues[5];

            if (code === correctCode) {
                showTransition(lockNumber);
            }
        }

        function checkAnswer() {
            if (document.getElementById("answer").value.toLowerCase() === "cintura") {
                showTransition(1.5);
            }
        }

        function showTransition(step) {
            document.querySelector(".visible").classList.remove("visible");
            let transitionDiv = document.getElementById("transition" + step);
            transitionDiv.style.display = "block";
            setTimeout(() => { transitionDiv.style.display = "none"; document.getElementById(step === 1 ? "textChallenge" : "lock2").classList.add("visible"); }, 3500);
        }
    </script>

</body>
</html>
